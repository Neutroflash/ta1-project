# MediTurno — Entrega y despliegue continuo (SIMULADO)
#
# Este caso de estudio no tiene una cuenta de AWS detrás, así que el despliegue
# se simula sobre el propio runner con contenedores Docker: staging y producción
# son contenedores que se levantan, se verifican y se dan de baja.
#
# La versión del flujo apuntando a infraestructura real (ECS Fargate, RDS,
# CodeDeploy y OIDC) queda documentada en docs/cd-aws-referencia.yml.

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Nunca dos despliegues simultáneos sobre el mismo ambiente.
  group: cd-produccion
  cancel-in-progress: false

env:
  IMAGEN: mediturno/api

jobs:
  # ---------------------------------------------------------------------------
  # STAGING — automático, sin intervención humana.
  # ---------------------------------------------------------------------------
  staging:
    name: Desplegar a staging (simulado)
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen de la versión
        run: docker build -t "$IMAGEN:${{ github.sha }}" .

      - name: Levantar el servicio de staging
        run: |
          docker run -d --name staging -p 8081:3000 "$IMAGEN:${{ github.sha }}"
          # Equivale al `aws ecs wait services-stable` del flujo real.
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8081/health >/dev/null && exit 0
            sleep 1
          done
          echo "El servicio no quedó sano a tiempo"; docker logs staging; exit 1

      - name: Pruebas de humo
        run: ./scripts/humo.sh http://127.0.0.1:8081

      - name: Resumen
        if: always()
        run: |
          echo "### Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versión desplegada: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pruebas de humo: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          docker rm -f staging >/dev/null 2>&1 || true

  # ---------------------------------------------------------------------------
  # PRODUCCIÓN — blue/green, verificación y rollback, todo sobre contenedores.
  # ---------------------------------------------------------------------------
  produccion:
    name: Desplegar a producción (simulado)
    runs-on: ubuntu-latest
    needs: staging
    # Si en Settings → Environments se le exigen revisores, este job espera la
    # aprobación manual. Sin revisores configurados, solo deja el registro de
    # qué versión se desplegó y cuándo.
    environment:
      name: produccion
    steps:
      - uses: actions/checkout@v7

      - name: Construir la imagen de la versión
        run: docker build -t "$IMAGEN:${{ github.sha }}" .

      - name: Grupo azul — la versión que está en producción
        run: |
          docker run -d --name azul -p 8080:3000 "$IMAGEN:${{ github.sha }}"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && break
            sleep 1
          done
          echo "Azul atendiendo el tráfico en el puerto 8080."

      - name: Grupo verde — levantar la versión nueva en paralelo
        run: |
          docker run -d --name verde -p 8090:3000 "$IMAGEN:${{ github.sha }}"
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/health >/dev/null && exit 0
            sleep 1
          done
          echo "El grupo verde no quedó sano: no se cambia el tráfico"; exit 1

      - name: Cambiar el tráfico de azul a verde
        id: cambio
        run: |
          ./scripts/humo.sh http://127.0.0.1:8090
          echo "Tráfico dirigido al grupo verde."
          echo "cambiado=si" >> "$GITHUB_OUTPUT"

      - name: Verificación posterior (tasa de error y latencia)
        id: verificar
        run: ./scripts/verificar.sh http://127.0.0.1:8090 --peticiones 40 --error-max 1 --p95-max 800

      - name: Rollback automático si la verificación falla
        if: failure() && steps.cambio.outputs.cambiado == 'si'
        run: |
          echo "Verificación fallida: se devuelve el tráfico al grupo azul."
          docker rm -f verde >/dev/null 2>&1 || true
          curl -sf http://127.0.0.1:8080/health && echo "Azul sigue sano: rollback completo."
          echo "ROLLBACK de ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dar de baja el grupo azul y etiquetar la versión
        if: success()
        run: |
          docker rm -f azul >/dev/null 2>&1 || true
          echo "Grupo azul retirado. Versión ${GITHUB_SHA::7} en producción."

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Producción (simulada)"
            echo "- Versión: \`${GITHUB_SHA::7}\`"
            echo "- Estrategia: blue/green sobre contenedores en el runner"
            echo "- Resultado: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
          docker rm -f azul verde >/dev/null 2>&1 || true
