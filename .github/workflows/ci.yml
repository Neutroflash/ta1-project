# MediTurno — Integración Continua
# Se ejecuta en cada Pull Request hacia main y en cada push a ramas feature.
# Objetivo: que ningún cambio llegue a main sin compilar, pasar pruebas y
# superar los controles de seguridad. Presupuesto de tiempo: < 10 min.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  # Un PR con varios push seguidos cancela las ejecuciones viejas: ahorra minutos
  # de runner y evita reportes de estado contradictorios.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Calidad estática: rápido y barato, falla primero si algo básico está mal.
  # ---------------------------------------------------------------------------
  calidad:
    name: Lint, formato y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Compilación de tipos (tsc --noEmit)
        run: npm run typecheck

  # ---------------------------------------------------------------------------
  # 2. Compilación: artefacto único que se reutiliza en el resto del pipeline.
  # ---------------------------------------------------------------------------
  compilacion:
    name: Compilación
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Compilar API (NestJS) y web (Vite)
        run: npm run build
      - name: Publicar artefacto de compilación
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            apps/api/dist
            apps/web/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Pruebas unitarias en matriz: detecta fallos dependientes de versión.
  # ---------------------------------------------------------------------------
  pruebas-unitarias:
    name: Pruebas unitarias (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: calidad
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Jest con cobertura
        run: npm run test:unit -- --coverage --coverageThreshold='{"global":{"lines":80,"branches":75}}'
      - name: Publicar reporte de cobertura
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  # ---------------------------------------------------------------------------
  # 4. Pruebas de integración contra PostgreSQL real (service container).
  #    Se prueban las migraciones, no solo el código: la migración es el paso
  #    que más incidentes de producción nos generaba antes del pipeline.
  # ---------------------------------------------------------------------------
  pruebas-integracion:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    needs: calidad
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mediturno
          POSTGRES_PASSWORD: test
          POSTGRES_DB: mediturno_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mediturno"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://mediturno:test@localhost:5432/mediturno_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Aplicar migraciones
        run: npm run db:migrate:deploy
      - name: Verificar reversibilidad de la migración
        run: npm run db:migrate:down && npm run db:migrate:deploy
      - run: npm run test:integration

  # ---------------------------------------------------------------------------
  # 5. Seguridad: obligatorio por manejar datos de salud (HIPAA/Ley 21.096).
  # ---------------------------------------------------------------------------
  seguridad:
    name: Análisis de seguridad
    runs-on: ubuntu-latest
    needs: calidad
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: SAST con CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
      - name: Dependencias vulnerables
        run: npm audit --audit-level=high
      - name: Detección de secretos
        uses: gitleaks/gitleaks-action@v2

  # ---------------------------------------------------------------------------
  # 6. Imagen Docker etiquetada con el SHA: el mismo binario que se promoverá
  #    a staging y a producción. Nunca se recompila por ambiente.
  # ---------------------------------------------------------------------------
  imagen:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    needs: [compilacion, pruebas-unitarias, pruebas-integracion, seguridad]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/mediturno/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Escaneo de la imagen (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/mediturno/api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
